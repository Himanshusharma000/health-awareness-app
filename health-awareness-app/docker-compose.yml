version: '3.8'

services:
  # MongoDB Database Service
  mongo:
    image: mongo:latest
    container_name: health-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - health-network

  # Node.js Backend Service
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: health-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/healthDB
    depends_on:
      - mongo
    networks:
      - health-network

  # React Frontend Service (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: health-frontend
    ports:
      - "3000:80"  # Mapping localhost:3000 to Nginx container port 80
    depends_on:
      - backend
    networks:
      - health-network

volumes:
  mongo-data:

networks:
  health-network:
    driver: bridge

name: Python Portfolio Checks

on:
  push:
    paths:
      - 'alzheimer-ml/**'
      - 'customer-churn-ml/**'
      - 'sales-analytics/**'
      - '.github/workflows/python-projects.yml'
  pull_request:
    paths:
      - 'alzheimer-ml/**'
      - 'customer-churn-ml/**'
      - 'sales-analytics/**'
      - '.github/workflows/python-projects.yml'

jobs:
  python-projects:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project:
          - alzheimer-ml
          - customer-churn-ml
          - sales-analytics

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r ${{ matrix.project }}/requirements.txt

      - name: Compile Python files
        working-directory: ${{ matrix.project }}
        run: python -m compileall -q .

      - name: Run project
        working-directory: ${{ matrix.project }}
        run: python ${{ matrix.project == 'sales-analytics' && 'analyze.py' || 'train.py' }}

      - name: Verify exported results
        shell: bash
        run: |
          if [[ "${{ matrix.project }}" == "sales-analytics" ]]; then
            test -f sales-analytics/results/kpi-summary.json
            test -f sales-analytics/results/monthly_revenue.csv
          else
            test -f "${{ matrix.project }}/results/model-results.json"
          fi
